services:
  - type: web
    name: shopease-storefront-api-production
    runtime: image
    image:
      # Replace this valid placeholder tag with an approved GHCR sha-<commit> tag before creating the service.
      url: ghcr.io/datweb07/ecommerce-app/storefront-api:sha-REPLACE-ME
      creds:
        fromRegistryCreds:
          name: shopease-ghcr-pull
    region: singapore
    plan: starter
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 30
    # The production release workflow applies indexes with its separate Atlas credential.
    envVars:
      - key: DEPLOY_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WEB_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
