name: shopease-prod-rehearsal
x-api: &api
  image: shopease-api:rehearsal
  init: true
  stop_grace_period: 30s
  environment:
    DEPLOY_ENV: local
    MONGODB_URI: mongodb://mongo:27017/web_rehearsal?replicaSet=rs0
  depends_on:
    mongo:
      condition: service_healthy

services:
  mongo:
    image: mongo:8.0.34@sha256:8e7d23aa641b0ec6c86418866d5d18d74d5abf89061bc5db7bc4b80929021ef6
    platform: linux/amd64
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27029:27017'
    volumes:
      - rehearsal-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (rs.status().myState !== 1) quit(1); } catch { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1); }"
      interval: 3s
      timeout: 5s
      retries: 30
  api:
    <<: *api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '127.0.0.1:4011:4000'
  api2:
    <<: *api
    profiles: [multi]
    pull_policy: never
    ports:
      - '127.0.0.1:4012:4000'

volumes:
  rehearsal-data:
