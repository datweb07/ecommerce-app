version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      website-compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      website-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /website/apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
