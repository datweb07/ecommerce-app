name: Website staging E2E
on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
concurrency:
  group: website-staging-e2e
  cancel-in-progress: true

jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'staging' &&
      (github.event.deployment.ref == 'main' || github.event.deployment.ref == 'refs/heads/main'))
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Test the deployed main commit
        if: github.event_name == 'deployment_status'
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$DEPLOYED_SHA" HEAD
          git checkout --detach "$DEPLOYED_SHA"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @storefront/web exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/website/.cache/playwright
      - name: Required development credentials and isolated suites
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          E2E_CLOUDINARY_CLOUD_NAME: ${{ vars.E2E_CLOUDINARY_CLOUD_NAME }}
        run: |
          set -euo pipefail
          pnpm e2e:env
          pnpm e2e:auth
          pnpm e2e:payment
          pnpm e2e:upload
